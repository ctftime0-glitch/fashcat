    <div class="container">

            <img src="icons.png">

        <div class="container2">

            <div class="search">
                <input type="search" id="search"  placeholder="search here ....." autocomplete="off">
            </div>

            <div class="inputFile">
                <input type="file" id="fileUpload" class="fileUpload" placeholder="select" accept=".php,.js,.py,.c,.cpp,.java,.xml,.yaml,.tex,.sh,.json,.dart,.html,.css" style="display: none;">
                <span class="fileName" id="fileName">belum ada file</span>
                <label for ="fileUpload" class="fileButton">
                    +
                </label>
            </div>

            <div class="buttonInput">
                <button type="button" id="searchButton">Send</button>
            </div>

        </div>
        <div class="container3">

            <div class="outputBox" id="outputBox">
                <p>Output...</p>
            </div>

        </div>
    </div>
